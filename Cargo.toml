[package]
name = "liquifact_yield_tier"
version = "0.1.0"
edition = "2021"
description = "LiquiFact yield tier contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0"

[dev-dependencies]
soroban-sdk = { version = "25.0", features = ["testutils"] }

[workspace]
members = ["escrow"]
resolver = "2" 

[workspace.metadata.cargo-llvm-cov]
# Exclude test scaffolding from coverage measurement — only production code is gated.
exclude = [
    "src/test/*",
    "**/*_test.rs",
    "tests/*"
]
